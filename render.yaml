services:
  # Single web service for the entire CRM Portal
  - type: web
    name: crm-portal
    env: node
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 3333
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://crm-portal-ha3l.onrender.com
      - key: SUPABASE_URL
        value: https://qijolfnxazrimboqkwqa.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  # No database needed - using Supabase
